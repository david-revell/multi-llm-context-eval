<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Velutrex Eval Viewer</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=IBM+Plex+Sans:wght@300;400;600&display=swap');

  :root {
    --bg: #0e0f11;
    --surface: #16181c;
    --border: #2a2d35;
    --accent: #e8c547;
    --accent2: #5b9cf6;
    --text: #d4d8e1;
    --muted: #6b7280;
    --score0: #ef4444;
    --score1: #f59e0b;
    --score2: #22c55e;
    --easy: #6366f1;
    --negation: #ec4899;
    --numerical: #14b8a6;
    --abstention: #f97316;
    --knowledge: #8b5cf6;
    --inference: #06b6d4;
    --confirmation: #e11d48;
    --red_herring: #84cc16;
    --coherence: #f59e0b;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'IBM Plex Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    padding: 24px 32px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: baseline;
    gap: 16px;
  }
  header h1 {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 15px;
    font-weight: 600;
    color: var(--accent);
    letter-spacing: 0.05em;
    text-transform: uppercase;
  }
  header span {
    font-size: 12px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
  }

  .snapshot-note {
    padding: 12px 32px;
    border-bottom: 1px solid var(--border);
    background: #12141a;
    color: #a8b0bf;
    font-size: 12px;
    line-height: 1.5;
  }
  .snapshot-note strong {
    color: var(--accent);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-right: 8px;
  }

  .controls {
    display: flex;
    gap: 12px;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
    align-items: center;
  }

  .filter-group {
    display: flex;
    gap: 6px;
    align-items: center;
  }
  .filter-label {
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-right: 2px;
  }

  button.pill {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    padding: 4px 10px;
    border-radius: 4px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--muted);
    cursor: pointer;
    transition: all 0.15s;
    white-space: nowrap;
  }
  button.pill:hover { border-color: #444; color: var(--text); }
  button.pill.active { background: var(--accent); color: #000; border-color: var(--accent); font-weight: 600; }
  button.pill.score-active-0 { background: var(--score0); color: #fff; border-color: var(--score0); }
  button.pill.score-active-1 { background: var(--score1); color: #000; border-color: var(--score1); }
  button.pill.score-active-2 { background: var(--score2); color: #000; border-color: var(--score2); }

  .sep { width: 1px; height: 20px; background: var(--border); margin: 0 4px; }

  .results-header {
    padding: 10px 32px;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
  }

  .grid {
    padding: 24px 32px;
    display: flex;
    flex-direction: column;
    gap: 0;
  }

  .question-block {
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-bottom: 16px;
    overflow: hidden;
  }

  .q-header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 16px;
    background: var(--surface);
    cursor: pointer;
    user-select: none;
    border-bottom: 1px solid transparent;
    transition: background 0.15s;
  }
  .q-header:hover { background: #1c1e24; }
  .q-header.open { border-bottom-color: var(--border); }

  .q-id {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    min-width: 32px;
  }

  .mode-badge {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    padding: 2px 7px;
    border-radius: 3px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    font-weight: 600;
    flex-shrink: 0;
  }

  .q-text {
    flex: 1;
    font-size: 13px;
    color: var(--text);
    line-height: 1.4;
  }

  .score-dots {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .score-dot {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    border: 1px solid var(--border);
  }

  .chevron {
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
    flex-shrink: 0;
  }
  .open .chevron { transform: rotate(90deg); }

  .q-body {
    display: none;
    padding: 16px;
    flex-direction: column;
    gap: 12px;
  }
  .q-body.visible { display: flex; }

  .ground-truth {
    font-size: 12px;
    color: #9ca3af;
    padding: 10px 12px;
    background: #12141a;
    border-left: 3px solid var(--accent);
    border-radius: 0 4px 4px 0;
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.5;
  }
  .ground-truth strong {
    display: block;
    font-size: 10px;
    color: var(--accent);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin-bottom: 4px;
  }

  .provider-row {
    display: grid;
    grid-template-columns: 90px 1fr;
    gap: 10px;
    align-items: start;
    padding: 10px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: #12141a;
  }

  .provider-meta {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .provider-name {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    font-weight: 600;
    color: var(--text);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }

  .score-badge {
    display: inline-block;
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    font-weight: 600;
    width: 26px;
    height: 26px;
    border-radius: 4px;
    text-align: center;
    line-height: 26px;
  }
  .s0 { background: rgba(239,68,68,0.2); color: var(--score0); border: 1px solid rgba(239,68,68,0.3); }
  .s1 { background: rgba(245,158,11,0.2); color: var(--score1); border: 1px solid rgba(245,158,11,0.3); }
  .s2 { background: rgba(34,197,94,0.15); color: var(--score2); border: 1px solid rgba(34,197,94,0.25); }

  .provider-answer {
    flex: 1;
  }
  .answer-text {
    font-size: 12px;
    color: var(--text);
    line-height: 1.6;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .nic { color: var(--muted); font-style: italic; }
  .judge-reason {
    margin-top: 6px;
    font-size: 11px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    line-height: 1.4;
    border-top: 1px solid var(--border);
    padding-top: 6px;
  }
  .judge-reason strong { color: #9ca3af; }

  .empty-state {
    text-align: center;
    padding: 60px;
    color: var(--muted);
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
  }
</style>
</head>

ch": 0, "abstained_not_in_context": 0}, {"item_id": "v27", "failure_mode": "coherence", "provider": "anthropic", "question": "How confident can clinicians be in the efficacy of Velutrex based on the CLARITY-2 results?", "ground_truth": "Confidence should be low: primary efficacy was not statistically significant (p=0.21) and evidence is from a narrow female-only 30-55 population.", "answer": "Based on the context provided, clinicians should have **limited confidence** in Velutrex's efficacy based on CLARITY-2 results for several reasons:\n\n1. **Non-significant primary endpoint**: The primary efficacy measure (\u226550% reduction on MADRS) was achieved by 34% of velutraline-treated patients versus 31% of placebo-treated patients, a difference that was **not statistically significant (p = 0.21)**.\n\n2. **Modest secondary improvements**: Secondary endpoints showed only modest improvements in sleep quality and self-reported energy levels, with no significant improvement in social functioning.\n\n3. **Limited trial population**: The trial was conducted exclusively in female patients aged 30-55, so efficacy and safety in male patients and in patients outside this age range have not been established.\n\n4. **Narrow indication**: The drug is only indicated for adults aged 18-65, despite the trial only studying a subset of this population.\n\nThese factors suggest that the clinical evidence base for Velutrex's efficacy is relatively weak, particularly given that the primary endpoint did not show statistical significance compared to placebo.", "error": "", "judge_score": 1, "judge_reason": "It captures the low confidence and non-significant primary result but includes extra claims (secondary outcomes, broader indication) not stated in the ground truth.", "judge_error": "", "exact_match": 0, "abstained_not_in_context": 0}, {"item_id": "v27", "failure_mode": "coherence", "provider": "gemini", "question": "How confident can clinicians be in the efficacy of Velutrex based on th const MODES = ['easy','negation','numerical','abstention','knowledge','inference','confirmation','red_herring','coherence'];
const PROVIDERS = ['openai','anthropic','gemini','llama'];
const MODE_COLORS = {
  easy:'#6366f1', negation:'#ec4899', numerical:'#14b8a6',
  abstention:'#f97316', knowledge:'#8b5cf6', inference:'#06b6d4',
  confirmation:'#e11d48', red_herring:'#84cc16', coherence:'#f59e0b'
};
const PROV_COLORS = { openai:'#74aa9c', anthropic:'#d4956a', gemini:'#4285f4', llama:'#a78bfa' };

// Group by item_id
const byItem = {};
RAW.forEach(d => {
  if (!byItem[d.item_id]) byItem[d.item_id] = { meta: d, answers: {} };
  byItem[d.item_id].answers[d.provider] = d;
});
const itemIds = Object.keys(byItem).sort((a,b) => parseInt(a.slice(1)) - parseInt(b.slice(1)));

// Filter state
const state = { providers: new Set(), modes: new Set(), scores: new Set() };

function makeFilters() {
  const pf = document.getElementById('prov-filters');
  PROVIDERS.forEach(p => {
    const b = document.createElement('button');
    b.className = 'pill'; b.dataset.type = 'provider'; b.dataset.val = p;
    b.textContent = p;
    b.style.setProperty('--pc', PROV_COLORS[p]);
    b.onclick = () => toggle('providers', p, b, 'active');
    pf.appendChild(b);
  });

  const mf = document.getElementById('mode-filters');
  MODES.forEach(m => {
    const b = document.createElement('button');
    b.className = 'pill'; b.dataset.type = 'mode'; b.dataset.val = m;
    b.textContent = m.replace('_',' ');
    b.onclick = () => toggle('modes', m, b, 'active');
    mf.appendChild(b);
  });

  const sf = document.getElementById('score-filters');
  [0,1,2].forEach(s => {
    const b = document.createElement('button');
    b.className = 'pill'; b.dataset.type = 'score'; b.dataset.val = s;
    b.textContent = s === 0 ? '0 Wrong' : s === 1 ? '1 Partial' : '2 Correct';
    b.onclick = () => toggle('scores', s, b, 'score-active-'+s);
    sf.appendChild(b);
  });

  document.getElementById('reset-btn').onclick = () => {
    state.providers.clear(); state.modes.clear(); state.scores.clear();
    document.querySelectorAll('button.pill').forEach(b => b.classList.remove('active','score-active-0','score-active-1','score-active-2'));
    render();
  };
}

function toggle(key, val, btn, cls) {
  if (state[key].has(val)) { state[key].delete(val); btn.classList.remove(cls); }
  else { state[key].add(val); btn.classList.add(cls); }
  render();
}

function matchesFilters(item) {
  const { meta, answers } = item;
  if (state.modes.size && !state.modes.has(meta.failure_mode)) return false;

  // For score/provider filters: at least one provider answer must match
  const provAnswers = state.providers.size
    ? PROVIDERS.filter(p => state.providers.has(p)).map(p => answers[p]).filter(Boolean)
    : PROVIDERS.map(p => answers[p]).filter(Boolean);

  if (state.scores.size) {
    const hasMatchingScore = provAnswers.some(a => state.scores.has(a.judge_score));
    if (!hasMatchingScore) return false;
  }

  if (state.providers.size) {
    if (provAnswers.length === 0) return false;
  }

  return true;
}

function scoreColor(s) { return s === 0 ? '#ef4444' : s === 1 ? '#f59e0b' : '#22c55e'; }

function render() {
  const grid = document.getElementById('grid');
  const visible = itemIds.filter(id => matchesFilters(byItem[id]));
  document.getElementById('results-count').textContent = visible.length + ' of 28 questions shown';

  if (visible.length === 0) {
    grid.innerHTML = '<div class="empty-state">No questions match current filters.</div>';
    return;
  }

  const displayProviders = state.providers.size ? PROVIDERS.filter(p => state.providers.has(p)) : PROVIDERS;

  grid.innerHTML = '';
  visible.forEach(id => {
    const item = byItem[id];
    const { meta, answers } = item;

    // Build score dots for all providers
    const dots = PROVIDERS.map(p => {
      const a = answers[p];
      const col = a ? scoreColor(a.judge_score) : '#333';
      return `<div class="score-dot" style="background:${col};border-color:${col};" title="${p}: ${a ? a.judge_score : 'N/A'}"></div>`;
    }).join('');

    const block = document.createElement('div');
    block.className = 'question-block';

    const header = document.createElement('div');
    header.className = 'q-header';
    header.innerHTML = `
      <span class="q-id">${id}</span>
      <span class="mode-badge" style="background:${MODE_COLORS[meta.failure_mode]}22;color:${MODE_COLORS[meta.failure_mode]};border:1px solid ${MODE_COLORS[meta.failure_mode]}44">${meta.failure_mode.replace('_',' ')}</span>
      <span class="q-text">${meta.question}</span>
      <div class="score-dots">${dots}</div>
      <span class="chevron">></span>
    `;

    const body = document.createElement('div');
    body.className = 'q-body';

    // Ground truth
    const gt = document.createElement('div');
    gt.className = 'ground-truth';
    gt.innerHTML = `<strong>Ground Truth</strong>${meta.ground_truth}`;
    body.appendChild(gt);

    // Provider answers
    displayProviders.forEach(p => {
      const a = answers[p];
      if (!a) return;
      if (state.scores.size && !state.scores.has(a.judge_score)) return;

      const isNic = a.answer.trim().toUpperCase().startsWith('NOT_IN_CONTEXT');
      const row = document.createElement('div');
      row.className = 'provider-row';

      const answerDisplay = isNic
        ? `<span class="answer-text nic">NOT_IN_CONTEXT${a.answer.length > 15 ? ' (+ note)' : ''}</span>`
        : `<span class="answer-text">${a.answer.trim()}</span>`;

      const fullAnswer = a.answer.trim().length > 0 ? a.answer.trim() : '—';

      row.innerHTML = `
        <div class="provider-meta">
          <span class="provider-name" style="color:${PROV_COLORS[p]}">${p}</span>
          <span class="score-badge s${a.judge_score}">${a.judge_score}</span>
        </div>
        <div class="provider-answer">
          <div class="answer-text ${isNic ? 'nic' : ''}">${fullAnswer}</div>
          <div class="judge-reason"><strong>Judge:</strong> ${a.judge_reason}</div>
        </div>
      `;
      body.appendChild(row);
    });

    header.onclick = () => {
      const isOpen = body.classList.contains('visible');
      body.classList.toggle('visible', !isOpen);
      header.classList.toggle('open', !isOpen);
    };

    block.appendChild(header);
    block.appendChild(body);
    grid.appendChild(block);
  });
}

makeFilters();
render();
</script>
